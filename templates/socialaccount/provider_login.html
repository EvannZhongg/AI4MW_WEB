<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI4MW 登录</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-0: #070b16;
        --bg-1: #0c1428;
        --surface-1: rgba(19, 28, 52, 0.92);
        --surface-2: rgba(26, 36, 63, 0.92);
        --stroke: rgba(128, 150, 186, 0.2);
        --muted: #9aa6bf;
        --text: #e6edf7;
        --accent: #5f8dff;
        --radius-lg: 18px;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: var(--text);
        min-height: 100vh;
        background: radial-gradient(circle at 12% 18%, rgba(95, 141, 255, 0.18), transparent 40%),
          radial-gradient(circle at 86% 10%, rgba(138, 99, 255, 0.12), transparent 35%),
          linear-gradient(180deg, var(--bg-0), var(--bg-1));
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      .card {
        width: min(420px, 92vw);
        background: var(--surface-1);
        border: 1px solid var(--stroke);
        border-radius: var(--radius-lg);
        padding: 24px;
        display: grid;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .provider {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 12px;
        background: var(--surface-2);
        border: 1px solid var(--stroke);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 6px rgba(95, 141, 255, 0.2);
      }

      button {
        width: 100%;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(95, 141, 255, 0.4);
        background: rgba(95, 141, 255, 0.2);
        color: var(--text);
        cursor: pointer;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <h1>AI4MW 登录</h1>
        <p>使用 GitHub 账户继续，以同步研究历史与工作流。</p>
      </div>
      <div class="provider">
        <div class="dot"></div>
        <div>
          <strong>GitHub</strong>
          <p>{{ provider.name }}</p>
        </div>
      </div>
      <form method="post">
        {% csrf_token %}
        <button type="submit">继续使用 GitHub 登录</button>
      </form>
    </div>
  </body>
</html>
