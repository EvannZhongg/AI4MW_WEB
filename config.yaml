# AI4MW runtime configuration (flat key-value YAML)
# Precedence: OS env > .env > config.yaml

ENV: dev
DEBUG: true
ALLOWED_HOSTS: localhost,127.0.0.1
TIME_ZONE: UTC
LANGUAGE_CODE: zh-hans

DB_ENGINE: django.db.backends.postgresql
DB_NAME: AI4MW_WEB
DB_USER: postgres
DB_HOST: localhost
DB_PORT: 5433

PARSER_PROVIDER: mineru
PARSER_BASE_URL: http://localhost:8002
PARSER_TIMEOUT_SEC: 120
PARSER_MAX_FILE_MB: 100

LINE_BUILD_BASE_URL: http://localhost:8004
LINE_BUILD_TIMEOUT_SEC: 120

LLM_AGENT_TOOL_WORKSPACE: .
LLM_AGENT_ENABLED_BUILTIN_TOOLS: glob,grep,list_dir,read_file
LLM_AGENT_ENABLE_SUBAGENTS: true
LLM_AGENT_MAX_TOOL_ROUNDS: 4
LLM_AGENT_MAX_SUBAGENT_TOOL_ROUNDS: 4
LLM_AGENT_MAX_TOOL_RESULT_CHARS: 120000

LLM_PROVIDER: openai
LLM_MODEL: gpt-5.2
LLM_API_BASE: https://gmncode.cn/v1
LLM_API_INTERFACE: auto
LLM_API_INTERFACE_PREFERENCE: responses # responses/chat_completions
LLM_TEMPERATURE: 0.2
LLM_CONNECT_TIMEOUT_SEC: 10
LLM_READ_TIMEOUT_SEC: 60
LLM_STREAM_READ_TIMEOUT_SEC: 300
LLM_MAX_RETRIES: 2
LLM_INITIAL_RETRY_DELAY_SEC: 1
LLM_MAX_RETRY_DELAY_SEC: 8
LLM_POOL_MAXSIZE: 20
LLM_EXTRA_HEADERS_JSON: {}

SUMMARY_LLM_PROVIDER: openai
SUMMARY_LLM_MODEL: qwen-plus-0723
SUMMARY_LLM_API_BASE: https://dashscope.aliyuncs.com/compatible-mode/v1
SUMMARY_LLM_API_INTERFACE: chat_completions
SUMMARY_LLM_TEMPERATURE: 0.2

PAPER_SEARCH_LLM_PROVIDER: openai
PAPER_SEARCH_LLM_MODEL: qwen3.5-plus
PAPER_SEARCH_LLM_API_BASE: https://dashscope.aliyuncs.com/compatible-mode/v1
PAPER_SEARCH_LLM_API_INTERFACE: auto
PAPER_SEARCH_LLM_API_INTERFACE_PREFERENCE: responses
PAPER_SEARCH_LLM_TEMPERATURE: 0.2
PAPER_SEARCH_LLM_CONNECT_TIMEOUT_SEC: 10
PAPER_SEARCH_LLM_READ_TIMEOUT_SEC: 60
PAPER_SEARCH_LLM_STREAM_READ_TIMEOUT_SEC: 300
PAPER_SEARCH_LLM_MAX_RETRIES: 2
PAPER_SEARCH_LLM_INITIAL_RETRY_DELAY_SEC: 1
PAPER_SEARCH_LLM_MAX_RETRY_DELAY_SEC: 8
PAPER_SEARCH_LLM_POOL_MAXSIZE: 20
PAPER_SEARCH_LLM_EXTRA_HEADERS_JSON: {}

EMBED_PROVIDER: openai
EMBED_MODEL: text-embedding-v4
EMBED_API_BASE: https://dashscope.aliyuncs.com/compatible-mode/v1
EMBED_DIM: 1024
EMBED_BATCH_SIZE: 10

VLM_PROVIDER: openai
VLM_MODEL: qwen3-vl-plus
VLM_API_BASE: https://dashscope.aliyuncs.com/compatible-mode/v1

NEXT_PUBLIC_API_BASE: http://localhost:8000
NEXT_PUBLIC_PLUGIN_REGISTRY: local
GITHUB_CLIENT_ID: Ov23li5EueS9KtZ7zICD
FRONTEND_URL: http://localhost:3000
